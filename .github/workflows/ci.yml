name: api-ci
on:
  pull_request:
    branches: [main, release]
  push:
    branches: [main, release]


jobs:
  build:
    runs-on: ubuntu-latest
   
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
      - name: seed env
        run: echo "${{ secrets.ENV_TEST }}" > .env.test
      - name: install dependencies
        run: npm ci
      - name: build
        run: npm run build
      - name: run test
        run: npm run test:e2e
      - name: clean-up
        if: always()
        run: npm run docker-down:test



